services:
  portfolio:
    build: .
    container_name: nugrah-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/portfolio.db"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
    volumes:
      - ./data:/app/data
